<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FINN</title>
<style>
:root{--bg:#0e1013;--card:#171a1f;--line:#262b33;--tx:#e8eaed;--mu:#8b929c;--ac:#6ee7b7;--rd:#f87171;--am:#fbbf24;--bl:#7aa2ff}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--tx:#15181d;--mu:#6b7280;--ac:#0f9f6e;--rd:#d93636;--am:#b7791f;--bl:#2f5fd0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,system-ui,Segoe UI,sans-serif;padding-bottom:76px}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 0 8px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;letter-spacing:.5px}h1 small{font-weight:400;color:var(--mu);font-size:11px;margin-left:8px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--am);color:var(--am);margin-left:6px;vertical-align:middle}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:5px 10px;border-radius:99px;font-size:12px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sum{color:var(--mu);font-size:12px;margin:6px 0 10px}.sum b{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tk{font-weight:700}.cat{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu)}
.must{border-left:3px solid var(--rd)}.skim{border-left:3px solid var(--bl)}
.sub{margin:3px 0 0}.mu{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
td,th{padding:4px 0;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500}td:first-child,th:first-child{text-align:left}
.up{color:var(--ac)}.dn{color:var(--rd)}
.bio{margin-top:8px;padding:8px;border-radius:8px;background:var(--bg);font-size:12.5px}
details summary{cursor:pointer;color:var(--mu);font-size:12px;padding:8px 0}
.set{display:grid;gap:12px;margin:10px 0}.set label{display:flex;justify-content:space-between;font-size:13px}
input[type=range]{width:100%}
input[type=text]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;text-transform:uppercase}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:8px;cursor:pointer}nav button.on{color:var(--tx);font-weight:700}
.pill{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:700}.met{background:var(--ac);color:#04130d}.miss{background:var(--rd);color:#fff}.rev{background:var(--am);color:#1a1200}.unc{background:var(--line);color:var(--mu)}
q{display:block;color:var(--mu);font-size:12px;margin-top:4px;quotes:none;font-style:italic}
.hide{display:none}
</style></head><body>
<div class="wrap">
<header><h1>FINN<small id="asof"></small><span class="badge" id="badge"></span></h1></header>
<main id="main"></main>
</div>
<nav><button data-t="today" class="on">Today</button><button data-t="alerts">Alerts</button><button data-t="ask">Ask</button></nav>
<script>
const D=/*__DATA__*/null;
const S={tab:"today",win:24,vol:D.defaults.vol_mult,px:D.defaults.price_pct,cats:new Set(["results","management_change","M&A","litigation","pledging","fund_raise"]),
  seen:new Set()};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("#asof").textContent="as of "+D.asof.replace("T"," ");
$("#badge").textContent=D.live?"LIVE":"SAMPLE DATA";
const CATS=["results","management_change","M&A","litigation","pledging","fund_raise","credit_rating","capex","dividend"];

// mirror of finn/alerts.py
function unusual(rows,vm,pp,lb=20){
  if(rows.length<lb+2)return null;const l=rows.at(-1),p=rows.at(-2);
  const base=rows.slice(-(lb+1),-1),avg=base.reduce((a,r)=>a+r.v,0)/base.length;
  const chg=(l.c/p.c-1)*100,mult=l.v/avg,out=[];
  if(mult>=vm)out.push(`volume ${mult.toFixed(1)}x ${lb}d avg`);
  if(Math.abs(chg)>=pp)out.push(`${chg>=0?"+":""}${chg.toFixed(1)}% on the day`);
  return out.length?{chg,mult,reasons:out}:null}
const pc=v=>v==null?"–":`<span class="${v>=0?"up":"dn"}">${v>=0?"+":""}${v}%</span>`;

function annCard(a){
  let x=`<div class="card ${a.tier}"><div class="row"><span><span class="tk">${a.ticker}</span> <span class="cat">${a.cat.replace("_"," ")}</span></span><span class="mu">${a.hours_ago<24?a.hours_ago+"h":Math.round(a.hours_ago/24)+"d"} ago</span></div><p class="sub">${esc(a.subject)}</p>`;
  if(a.body&&a.tier!=="routine")x+=`<div class="mu">${esc(a.body)}</div>`;
  if(a.results){const r=a.results,L={revenue:"Revenue",ebitda:"EBITDA",pbt:"PBT",pat:"PAT"};
    x+=`<table><tr><th>₹ cr</th><th></th><th>QoQ</th><th>YoY</th></tr>`+Object.keys(L).map(k=>`<tr><td>${L[k]}</td><td>${r[k].value.toLocaleString("en-IN")}</td><td>${pc(r[k].qoq)}</td><td>${pc(r[k].yoy)}</td></tr>`).join("")+
    `</table><div class="mu" style="margin-top:6px">EBITDA margin ${r.ebitda_margin}% (${r.margin_delta_yoy_bps>=0?"+":""}${r.margin_delta_yoy_bps} bps YoY). EBITDA derived from filing.</div>`}
  if(a.mgmt)x+=`<div class="bio"><b>${esc(a.mgmt.person)}</b> · ${esc(a.mgmt.role)}<br>${esc(a.mgmt.bio)}</div>`;
  return x+"</div>"}

function today(){
  const items=D.ann.filter(a=>a.hours_ago<=S.win),must=items.filter(a=>a.tier==="must"),skim=items.filter(a=>a.tier==="skim"),rt=items.filter(a=>a.tier==="routine");
  const un=Object.keys(D.prices).filter(t=>unusual(D.prices[t],S.vol,S.px)).length;
  return `<div class="chips">${[[24,"24h"],[72,"3d"],[168,"7d"]].map(([h,l])=>`<button class="chip ${S.win===h?"on":""}" data-win="${h}">${l}</button>`).join("")}</div>
  <div class="sum"><b>${items.length}</b> filings → <b>${must.length}</b> need you, <b>${skim.length}</b> worth a skim, <b>${rt.length}</b> routine hidden. <b>${un}</b> unusual price/volume move${un===1?"":"s"}.</div>
  ${must.map(annCard).join("")||'<div class="mu">Nothing urgent in this window.</div>'}
  ${skim.length?`<details><summary>Worth a skim (${skim.length})</summary>${skim.map(annCard).join("")}</details>`:""}
  ${rt.length?`<details><summary>Routine (${rt.length}) – ESOPs, certificates, notices</summary>${rt.map(a=>`<div class="mu" style="padding:3px 0"><b>${a.ticker}</b> ${esc(a.subject)}</div>`).join("")}</details>`:""}`}

function alertsTab(){
  const hits=Object.keys(D.prices).map(t=>[t,unusual(D.prices[t],S.vol,S.px)]).filter(x=>x[1]);
  const ev=D.ann.filter(a=>S.cats.has(a.cat)&&a.hours_ago<=S.win);
  return `<div class="set"><label>Volume ≥ <b>${S.vol.toFixed(1)}×</b> 20d avg</label><input type="range" id="vol" min="1.2" max="5" step=".1" value="${S.vol}">
  <label>Price move ≥ <b>±${S.px.toFixed(1)}%</b></label><input type="range" id="px" min="1" max="10" step=".5" value="${S.px}">
  <div class="mu">Alert me on filing types (uses the window from Today: ${S.win}h)</div>
  <div class="chips" style="margin:0">${CATS.map(c=>`<button class="chip ${S.cats.has(c)?"on":""}" data-cat="${c}">${c.replace("_"," ")}</button>`).join("")}</div></div>
  <div class="sum"><b>${hits.length}</b> market trigger${hits.length===1?"":"s"}, <b>${ev.length}</b> filing trigger${ev.length===1?"":"s"}</div>
  ${hits.map(([t,u])=>`<div class="card must"><div class="row"><span><span class="tk">${t}</span> <span class="cat">${D.portfolio[t].name}</span></span><span class="${u.chg>=0?"up":"dn"}">${u.chg>=0?"+":""}${u.chg.toFixed(1)}%</span></div><div class="mu">${u.reasons.join(" · ")}</div></div>`).join("")}
  ${ev.map(annCard).join("")}`}

function ask(q=""){
  const t=(S.q||"").toUpperCase(),p=D.pvd[t];
  let out="";
  if(t&&p)out=`<div class="sum"><b>${t}</b> · what management said vs what happened <span class="badge">${esc(p.note.split(" - ")[0])}</span></div>`+
    p.rows.map(r=>`<div class="card"><div class="row"><b>${esc(r.metric)}</b><span class="pill ${r.status}">${{met:"DELIVERED",rev:"REVISED",unc:"UNCLEAR",miss:"MISSED"}[r.status]}</span></div><div class="sub">Said (${r.call}): ${esc(r.said)}</div><div class="sub">Got: <b>${esc(r.got)}</b></div><q>${esc(r.quote)}</q></div>`).join("")+`<div class="mu">${esc(p.note)}</div>`;
  else if(t)out=`<div class="card"><b>${esc(t)}</b><p class="sub mu">The live engine works for any NSE ticker, but it needs network and an API key, so this hosted demo only ships a cached example. Run:<br><code>ANTHROPIC_API_KEY=… python -m finn.pull ${esc(t)}</code><br>It fetches the last 4 concall transcripts from screener.in and returns the same table with verbatim quotes. Primary sources only.</p></div>`;
  return `<div class="sum">Ask about any ticker. Currently built: <b>promised vs delivered</b> (guidance in concalls against what followed).</div>
  <input type="text" id="q" placeholder="Ticker, e.g. TCS" value="${esc(S.q||"")}"><div class="chips">${["TCS","INFY","DIXON"].map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join("")}</div>${out}`}

function render(){
  $("#main").innerHTML={today,alerts:alertsTab,ask}[S.tab]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  const v=$("#vol"),p=$("#px");
  if(v)v.oninput=e=>{S.vol=+e.target.value;render();$("#vol").focus()};
  if(p)p.oninput=e=>{S.px=+e.target.value;render();$("#px").focus()};
  const q=$("#q");if(q)q.onkeydown=e=>{if(e.key==="Enter"){S.q=q.value;render()}};
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){S.tab=b.dataset.t}
  else if(b.dataset.win)S.win=+b.dataset.win;
  else if(b.dataset.cat){S.cats.has(b.dataset.cat)?S.cats.delete(b.dataset.cat):S.cats.add(b.dataset.cat)}
  else if(b.dataset.q)S.q=b.dataset.q;else return;render()});
render();
</script></body></html>
